/* One screen: the 15-second gameplay loop behind the title, a winged sun above it and a
   download cartouche below. The art is pixel blocks in the colours of Tutankhamun's mask,
   gold and lapis lazuli. The page is the same in light and dark mode, because the footage is. */
:root {
  --night: #0c0905;
  --gold: #f2c445;
  --gold-hi: #ffe27a;
  --glow: rgba(255, 196, 84, .55);
  --ink: rgba(10, 7, 3, .38);
  --rise: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--night) url("media/poster.jpg") center / cover no-repeat; -webkit-tap-highlight-color: transparent; }

.bg { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
/* Darken the middle a little for the title and the edges a little more, so any frame reads. */
.shade { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 46% at 50% 48%, rgba(12, 8, 3, .40), rgba(12, 8, 3, 0) 72%),
    radial-gradient(ellipse 120% 100% at 50% 50%, rgba(8, 5, 2, 0) 55%, rgba(8, 5, 2, .5) 100%),
    linear-gradient(rgba(8, 5, 2, .3), rgba(8, 5, 2, 0) 24%, rgba(8, 5, 2, 0) 74%, rgba(8, 5, 2, .4)); }

main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(12px, 3.4vh, 36px); padding: 16px; padding-bottom: calc(16px + 4vh); }
main > * { animation: rise 1.4s var(--rise) both; }
h1 { margin: 0; line-height: 0; animation-delay: .25s; }
.sun { display: block; width: min(60vw, 660px, 95vh); height: auto; overflow: visible;
  filter: drop-shadow(0 .5vh .9vh rgba(0, 0, 0, .55)); animation-delay: .05s; }
.logo { display: block; width: min(88vw, 1100px, 150vh); height: auto; overflow: visible;
  filter: drop-shadow(0 .7vh 1.4vh rgba(0, 0, 0, .6)); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

.sun-glow { transform-box: fill-box; transform-origin: center; animation: glow 4.5s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .45; transform: scale(.9); } to { opacity: 1; transform: scale(1.08); } }
.logo-shine { animation: shine 8s ease-in-out 2s infinite; }
@keyframes shine { from { transform: translateX(0) skewX(-20deg); } 16%, to { transform: translateX(96px) skewX(-20deg); } }

.get { display: block; width: clamp(54px, 5vw, 84px); outline: none; animation-delay: .55s; border-radius: 6px; }
.get-icon { display: block; width: 100%; height: auto; overflow: visible; transition: transform .25s var(--rise), filter .25s;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .6)); }
.get:hover .get-icon, .get:focus-visible .get-icon { transform: translateY(-3px);
  filter: brightness(1.12) drop-shadow(0 0 14px var(--glow)) drop-shadow(0 4px 8px rgba(0, 0, 0, .6)); }
.get:hover .px-y, .get:focus-visible .px-y { animation: bob 1s ease-in-out infinite; }
.get:active .get-icon { transform: translateY(0); }
@keyframes bob { 50% { transform: translateY(1px); } }
.get:focus-visible { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--gold-hi); }

.sound { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%;
  background: var(--ink); cursor: pointer; opacity: .8; transition: opacity .2s, background .2s; animation: rise 1.4s var(--rise) .9s both; }
.sound:hover, .sound:focus-visible { opacity: 1; background: rgba(10, 7, 3, .6); }
.sound:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.sound svg { width: 26px; height: auto; }
.sound[aria-pressed="true"] .sound-off, .sound[aria-pressed="false"] .sound-on { display: none; }
.sound.hint { animation: rise 1.4s var(--rise) .9s both, hint 2.6s ease-in-out 2.5s infinite; }
@keyframes hint { 50% { box-shadow: 0 0 0 7px rgba(242, 196, 69, .22); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    if (!Context) { button.hidden = true; return; }

    function seamless(buffer) {
      var n = buffer.length, x = Math.min(Math.round(CROSSFADE * buffer.sampleRate), n >> 2);
      for (var c = 0; c < buffer.numberOfChannels; c++) {
        var data = buffer.getChannelData(c);
        for (var i = 0; i < x; i++) {
          var p = (i / x) * Math.PI / 2;  // equal power: the wind is noise, so the two ends are uncorrelated
          data[n - x + i] = data[n - x + i] * Math.cos(p) + data[i] * Math.sin(p);
        }
      }
      return { start: x / buffer.sampleRate, end: n / buffer.sampleRate };
    }

    function load() {
      if (!loading) {
        loading = fetch(file)
          .then(function (response) { if (!response.ok) throw new Error(response.status); return response.arrayBuffer(); })
          .then(function (data) { return new Promise(function (ok, fail) { ctx.decodeAudioData(data, ok, fail); }); })
          .then(function (buffer) {
            var loop = seamless(buffer), source = ctx.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.loopStart = loop.start;
            source.loopEnd = loop.end;
            source.connect(gain);
            source.start(0, loop.start);
          });
        loading.catch(function () { button.hidden = true; });
      }
      return loading;
    }

    function fade(on) {
      var now = ctx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.setTargetAtTime(on ? VOLUME : 0, now, on ? 0.9 : 0.25);
    }

    // Called from a click or key press: creating and resuming the context must happen there.
    function setSound(on) {
      wanted = on;
      button.setAttribute("aria-pressed", String(on));
      button.classList.remove("hint");
      if (!ctx) {
        ctx = new Context();
        gain = ctx.createGain();
        gain.gain.value = 0;
        gain.connect(ctx.destination);
      }
      if (on) {
        ctx.resume();
        load().then(function () { if (wanted && !document.hidden) fade(true); });
      } else {
        fade(false);
        setTimeout(function () { if (!wanted) ctx.suspend(); }, 1500);
      }
    }

    function remember(value) {
      choice = value;
      try { localStorage.setItem(KEY, value); } catch (e) {}
    }

    // Every click or key press tries until the sound is actually running: which event counts
    // as a gesture differs between browsers (iOS only trusts the end of a tap).
    function gesture(event) {
      if (video.paused && !("still" in video.dataset)) video.play().catch(function () {});
      if (button.contains(event.target) || choice === "off") return;  // the speaker's own click decides
      if (!wanted || ctx.state !== "running") setSound(true);
    }
    ["pointerup", "touchend", "click", "keydown"].forEach(function (type) {
      addEventListener(type, gesture, { capture: true, passive: true });
    });

    button.addEventListener("click", function () {
      var on = !wanted;
      remember(on ? "on" : "off");
      setSound(on);
    });

    // Quiet while the tab is hidden; back when it returns.
    document.addEventListener("visibilitychange", function () {
      if (!ctx || !wanted) return;
      if (document.hidden) {
        fade(false);
        setTimeout(function () { if (document.hidden) ctx.suspend(); }, 800);
      } else {
        ctx.resume();
        load().then(function () { if (wanted) fade(true); });
      }
    });

    if (choice === "off") button.classList.remove("hint");
  })();
</script>
</body>
</html>
